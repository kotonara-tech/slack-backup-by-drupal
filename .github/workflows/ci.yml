name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 手動実行で backend-e2e / frontend-e2e を強制発火

# changes ジョブが gh(GitHub API) で PR の変更ファイルを取得するため pull-requests:read が必要。
permissions:
  contents: read
  pull-requests: read

# テストピラミッド順。重い E2E (large) は変更パスで条件発火。
# アクションは Node24 ネイティブ版を使用（dorny/paths-filter・pre-commit/action は Node20 同梱のため不使用）。
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - name: Detect changed paths (PR のみ。push/dispatch は E2E を無条件実行)
        id: f
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          backend=false; frontend=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --name-only)"
            echo "Changed files:"; echo "$files"
            echo "$files" | grep -Eq '^(web/modules/custom/slack_portal/|composer\.json$|composer\.lock$|phpstan\.neon$|phpcs\.xml$|web/phpunit\.xml$)' && backend=true || true
            echo "$files" | grep -Eq '^frontend/' && frontend=true || true
          fi
          echo "backend=$backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  drupal-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
      - run: ddev composer install
      - run: ddev exec vendor/bin/phpstan analyze web/modules/custom/slack_portal -l 5
      - run: ddev exec vendor/bin/phpcs --standard=phpcs.xml web/modules/custom/slack_portal

  drupal-phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
      - run: ddev composer install
      - run: test -f web/phpunit.xml || cp web/core/phpunit.xml.dist web/phpunit.xml
      - run: ddev exec vendor/bin/phpunit -c web/phpunit.xml --testsuite Unit,Kernel

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck && npm run lint
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  # --- large E2E（条件発火） ---
  backend-e2e:
    needs: [changes, drupal-phpunit]
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ddev/github-action-setup-ddev@v1
      - run: ddev composer install
      - run: test -f web/phpunit.xml || cp web/core/phpunit.xml.dist web/phpunit.xml
      - run: ddev exec vendor/bin/phpunit -c web/phpunit.xml --testsuite Functional

  frontend-e2e:
    needs: [changes, frontend-build]
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Playwright E2E (skip until specs exist)
        run: |
          cd frontend
          if [ -n "$(find tests/e2e -name '*.spec.ts' -print -quit 2>/dev/null)" ]; then
            npx playwright install --with-deps chromium
            npx playwright test
          else
            echo "no Playwright specs yet — skipping (skeleton; specs land in docs/plan 04/05)"
          fi
