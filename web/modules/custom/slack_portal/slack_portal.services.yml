# Slack Portal のサービス定義。
# SlackClientFactory / SlackFetcher / CanonicalJsonWriter 等は Milestone 1 で TDD により追加する。
services:
  slack_portal.client_factory:
    class: Drupal\slack_portal\Service\SlackClientFactory

  slack_portal.cursor_iterator:
    class: Drupal\slack_portal\Service\CursorIterator

  slack_portal.message_formatter:
    class: Drupal\slack_portal\Service\CanonicalMessageFormatter

  slack_portal.thread_folder:
    class: Drupal\slack_portal\Service\ThreadFolder

  logger.channel.slack_portal:
    parent: logger.channel_base
    arguments: ['slack_portal']

  slack_portal.fetcher:
    class: Drupal\slack_portal\Service\SlackFetcher
    arguments: ['@slack_portal.cursor_iterator', '@logger.channel.slack_portal']

  slack_portal.file_downloader:
    class: Drupal\slack_portal\Service\SlackFileDownloader
    arguments: ['@http_client', '@file_system', '@logger.channel.slack_portal']

  slack_portal.json_writer:
    class: Drupal\slack_portal\Service\CanonicalJsonWriter
    arguments: ['@file_system', '@logger.channel.slack_portal']
