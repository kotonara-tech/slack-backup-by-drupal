langcode: en
status: true
dependencies:
  enforced:
    module:
      - slack_portal
  module:
    - search_api_db
id: slack_db
name: 'Slack DB Server'
description: 'Database backend for Slack message full-text search (M3).'
backend: search_api_db
backend_config:
  database: 'default:default'
  min_chars: 3
  matching: words
  phrase: bigram
  autocomplete:
    suggest_suffix: true
    suggest_words: true
